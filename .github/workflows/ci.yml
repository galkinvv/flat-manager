on: [push, pull_request]

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get install -y libostree-dev
      - name: Check
        run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: sudo apt-get install -y libostree-dev
      - name: Check
        run: cargo test

  end-to-end:
    name: End-to-end upload test
    runs-on: ubuntu-22.04
    steps:
     - uses: actions/checkout@v4

     - name: Start containers
       working-directory: ./tests
       run: |
         set -euxo pipefail
         docker compose up -d --build
         docker compose ps -a

     - name: Wait for flat-manager to be running
       working-directory: ./tests
       run: |
         set -euxo pipefail
         for _ in $(seq 1 15); do
           if [ -n "$(docker compose ps --status running --quiet flat-manager)" ]; then
             docker compose ps -a
             exit 0
           fi
           sleep 2
         done
         echo "flat-manager failed to reach running state"
         docker compose ps -a
         docker compose logs --no-color --timestamps flat-manager db || true
         exit 1

     - name: Run test
       working-directory: ./tests
       run: |
         set -euxo pipefail
         docker compose ps -a
         cid="$(docker compose ps -q flat-manager)"
         if [ -z "$cid" ]; then
           echo "No container ID found for flat-manager"
           docker compose logs --no-color --timestamps flat-manager db || true
           exit 1
         fi
         docker inspect --format \
           'flat-manager state={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
           "$cid"
         if [ "$(docker inspect --format '{{.State.Running}}' "$cid")" != "true" ]; then
           echo "flat-manager container is not running; dumping logs"
           docker logs "$cid" || true
           docker compose logs --no-color --timestamps flat-manager db || true
           exit 1
         fi
         rc=0
         docker compose exec -T -e PYTHONUNBUFFERED=1 flat-manager ./tests/run-test.py || rc=$?
         if [ "$rc" -ne 0 ]; then
           echo "run-test.py failed with exit code $rc"
           docker compose ps -a
           docker stats --no-stream || true
           cid_after="$(docker compose ps -q flat-manager)"
           if [ -n "$cid_after" ]; then
             docker inspect --format \
               'flat-manager post-test state={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restart={{.RestartCount}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
               "$cid_after" || true
           fi
           docker compose logs --no-color --timestamps --tail=300 flat-manager db || true
           exit "$rc"
         fi

     - name: Dump compose diagnostics on failure
       if: failure()
       working-directory: ./tests
       run: |
         docker compose ps -a
         docker compose logs --no-color --timestamps || true

  fmt:
    name: Rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: sudo apt-get install -y libostree-dev
      - name: Clippy
        run: cargo clippy -- -D warnings

  docker:
    name: Build via Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: flatpak-manager-client:latest
          load: true
          push: ${{ github.ref == 'refs/heads/master' }}
          platforms: linux/amd64

      - name: extract
        uses: shrink/actions-docker-extract@v4
        id: extract
        with:
          image: flatpak-manager-client:latest
          path: /usr/local/bin/flat-manager-client
          destination: dist

      - name: Upload Dist
        uses: actions/upload-artifact@v7
        with:
          path: dist
